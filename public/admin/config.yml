# ─────────────────────────────────────────────────────────────
#  Padkos & Passports — editor settings (Decap CMS)
#  You only need to change the FOUR lines marked ✏️ during setup.
# ─────────────────────────────────────────────────────────────
backend:
  name: github
  repo: Paresh-Maharaj/padkos-and-passports   # ✏️ your GitHub username / repository name
  branch: main
  base_url: https://padkos-and-passports.pages.dev    # ✏️ your site's web address (no slash at the end)
  auth_endpoint: api/auth
  commit_messages:
    create: 'New {{collection}}: {{slug}}'
    update: 'Update {{collection}}: {{slug}}'
    delete: 'Delete {{collection}}: {{slug}}'
    uploadMedia: 'Upload photo {{path}}'
    deleteMedia: 'Delete photo {{path}}'

# Lets you save drafts and preview them before they go live.
publish_mode: editorial_workflow

# Lets the editor run on your own computer too (optional, for helpers).
local_backend: true

site_url: https://padkos-and-passports.pages.dev       # ✏️ your site address again
display_url: https://padkos-and-passports.pages.dev    # ✏️ and once more
logo_url: /favicon.svg

media_folder: src/assets/uploads
public_folder: ../../assets/uploads

collections:
  # ───────────── Stories ─────────────
  - name: posts
    label: Stories
    label_singular: Story
    description: Your travel stories. Click "New Story" to write one.
    folder: src/content/posts
    create: true
    slug: '{{slug}}'
    media_folder: ../../assets/uploads
    public_folder: ../../assets/uploads
    sortable_fields: ['date', 'title', 'country']
    summary: '{{title}} — {{country}} ({{date}})'
    view_filters:
      - { label: 'Solo trips', field: tripType, pattern: solo }
      - { label: 'Family trips', field: tripType, pattern: family }
      - { label: 'Sponsored', field: sponsored, pattern: true }
    fields:
      - { label: Title, name: title, widget: string, hint: 'Keep it under about 70 characters so it fits in Google results.' }
      - { label: Short summary, name: description, widget: text, hint: 'One or two sentences (under 200 characters). Shown on cards, in Google and when shared on WhatsApp.' }
      - { label: Date, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'D MMMM YYYY', time_format: false, picker_utc: true }
      - { label: Updated on, name: updated, widget: datetime, format: 'YYYY-MM-DD', date_format: 'D MMMM YYYY', time_format: false, picker_utc: true, required: false, hint: 'Only fill this in if you revise an older story.' }
      - { label: Cover photo, name: cover, widget: image, hint: 'Landscape photos work best. Any size is fine — the site shrinks them automatically.' }
      - { label: Describe the cover photo, name: coverAlt, widget: string, hint: 'What is in the photo? e.g. "Sunset over the Swartberg Pass". Helps blind readers and Google.' }
      - { label: Main country, name: country, widget: string, hint: 'Where most of the trip happened, e.g. South Africa, Zimbabwe, Egypt. Use the same spelling each time.' }
      - { label: Other countries visited on this trip, name: alsoVisited, widget: list, required: false, default: [], hint: 'Optional. Separate with commas, e.g. Zambia, Botswana, Namibia. The story then appears under each country on the Destinations page.' }
      - label: Pins on the travel map
        name: places
        widget: list
        required: false
        collapsed: true
        label_singular: pin
        summary: '{{fields.name}}'
        hint: 'Optional. Every country above is pinned automatically. Add a pin here only for a special spot, e.g. Victoria Falls or Impalila Island: name it, then click its position on the little map.'
        fields:
          - { label: Place name, name: name, widget: string }
          - { label: 'Where is it?', name: location, widget: map, type: Point, decimals: 4, hint: 'Zoom in with the + button or mouse wheel, then click once on the spot.' }
      - { label: When you travelled, name: travelDates, widget: string, required: false, hint: 'Optional, in your own words, e.g. 7–10 August 2026 or Winter 2025.' }
      - label: Region
        name: region
        widget: select
        hint: 'Pick the region of the main country. Egypt, Zimbabwe, Namibia and the rest of the continent are "Rest of Africa".'
        options:
          - { label: 'South Africa', value: south-africa }
          - { label: 'Rest of Africa', value: africa }
          - { label: 'The wider world', value: world }
      - label: Trip style
        name: tripType
        widget: select
        options:
          - { label: 'Solo', value: solo }
          - { label: 'Couple (with my travel buddy)', value: couple }
          - { label: 'Family', value: family }
      - { label: Topics, name: tags, widget: list, required: false, default: [], hint: 'Comma-separated, e.g. road trip, budget, with kids' }
      - { label: 'Feature on the homepage?', name: featured, widget: boolean, required: false, default: false, hint: 'The newest featured story is shown big at the top of the homepage.' }
      - { label: 'Sponsored story?', name: sponsored, widget: boolean, required: false, default: false, hint: 'Switch on if any part of the trip was paid for by a partner. A clear note is added automatically.' }
      - { label: Sponsor name, name: sponsorName, widget: string, required: false, hint: 'Only needed for sponsored stories.' }
      - label: Photo gallery
        name: gallery
        widget: list
        required: false
        collapsed: true
        allow_add: true
        add_to_top: false
        label_singular: photo
        summary: '{{fields.alt}}'
        hint: 'Optional. Click "Add photo" for each picture. They appear as a grid after the story; readers can tap one to see it large.'
        fields:
          - { label: Photo, name: image, widget: image }
          - { label: Describe the photo, name: alt, widget: string, hint: 'What is in the picture? Helps blind readers and Google.' }
          - { label: Caption, name: caption, widget: string, required: false }
      - { label: Hide from the site, name: draft, widget: boolean, required: false, default: false, hint: 'Keeps a published story off the site without deleting it.' }
      - { label: Story, name: body, widget: markdown, hint: 'Use the toolbar for headings, bold text, lists and photos.' }

  # ───────────── Pages ─────────────
  - name: pages
    label: Pages
    files:
      - label: About me
        name: about
        file: src/content/pages/about.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Short summary, name: description, widget: string }
          - { label: Page text, name: body, widget: markdown }
      - label: Homepage
        name: homepage
        file: src/data/homepage.json
        description: The words at the top of the homepage and on its section headings.
        fields:
          - { label: Small heading above the title, name: eyebrow, widget: string, required: false, hint: 'Shown in small capital letters, e.g. A South African travel journal' }
          - { label: Big title – first line, name: headlineLine1, widget: string }
          - { label: Big title – second line (shown in orange italics), name: headlineLine2, widget: string, required: false }
          - { label: Introduction, name: intro, widget: text, hint: 'Two or three sentences under the big title.' }
          - label: Main button
            name: primaryButton
            widget: object
            fields:
              - { label: Button text, name: label, widget: string }
              - { label: Goes to, name: link, widget: string, hint: 'e.g. /blog/ for all stories' }
          - label: Second button
            name: secondaryButton
            widget: object
            fields:
              - { label: Button text, name: label, widget: string }
              - { label: Goes to, name: link, widget: string, hint: 'e.g. /newsletter/ for the sign-up page' }
          - { label: Heading above the three regions, name: regionsHeading, widget: string }
          - label: Region descriptions
            name: regionBlurbs
            widget: object
            fields:
              - { label: South Africa, name: southAfrica, widget: string }
              - { label: Rest of Africa, name: africa, widget: string }
              - { label: The wider world, name: world, widget: string }
          - { label: Heading above the latest stories, name: latestHeading, widget: string }
          - { label: Heading above the travel map, name: mapHeading, widget: string, required: false }

  # ───────────── Site settings ─────────────
  - name: settings
    label: Site settings
    editor: { preview: false }
    files:
      - label: Site settings
        name: site
        file: src/data/settings.json
        fields:
          - { label: Blog name, name: siteTitle, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Web address, name: siteUrl, widget: string, hint: 'e.g. https://padkosandpassports.co.za — change this when you add your own domain.' }
          - { label: Language code, name: language, widget: hidden, default: en-ZA }
          - label: About you
            name: author
            widget: object
            fields:
              - { label: Your name, name: name, widget: string }
              - { label: Short bio, name: shortBio, widget: text }
              - { label: "Where you're based", name: location, widget: string }
              - { label: Contact email, name: email, widget: string }
              - { label: Your photo, name: photo, widget: image, required: false, media_folder: /src/assets/uploads, public_folder: /src/assets/uploads, hint: 'Optional. A friendly head-and-shoulders photo, shown on the About page and at the end of every story.' }
          - { label: Home on the travel map, name: mapHome, widget: map, type: Point, decimals: 3, required: false, hint: 'Optional. Click where home is. Every flight on the map starts here. If left empty, the map uses Durban.' }
          - label: Social media links
            name: social
            widget: object
            collapsed: true
            hint: 'Paste the full link to each profile. Leave blank to hide.'
            fields:
              - { label: Instagram, name: instagram, widget: string, required: false }
              - { label: Facebook, name: facebook, widget: string, required: false }
              - { label: YouTube, name: youtube, widget: string, required: false }
              - { label: Pinterest, name: pinterest, widget: string, required: false }
              - { label: TikTok, name: tiktok, widget: string, required: false }
          - label: Newsletter
            name: newsletter
            widget: object
            collapsed: true
            fields:
              - { label: Show the sign-up box, name: enabled, widget: boolean }
              - { label: Heading, name: heading, widget: string }
              - { label: Blurb, name: blurb, widget: text }
              - { label: Form action (from your newsletter provider), name: formAction, widget: string, required: false, hint: 'The web address your provider gives for an "HTML form" embed.' }
              - { label: Email field name, name: emailFieldName, widget: string, hint: 'Also from the provider''s HTML form, e.g. email_address or fields[email].' }
              - { label: Button text, name: buttonLabel, widget: string }
          - label: Sponsor banner
            name: sponsor
            widget: object
            collapsed: true
            hint: 'A small, clearly labelled box at the end of every story.'
            fields:
              - { label: Show the sponsor banner, name: enabled, widget: boolean }
              - { label: Label, name: label, widget: string }
              - { label: Sponsor name, name: name, widget: string, required: false }
              - { label: Message, name: message, widget: text, required: false }
              - { label: Link, name: url, widget: string, required: false }
              - { label: Button text, name: buttonLabel, widget: string }
          - label: Media kit (Work with me page)
            name: mediaKit
            widget: object
            collapsed: true
            fields:
              - { label: Monthly readers, name: monthlyReaders, widget: string }
              - { label: Newsletter subscribers, name: newsletterSubscribers, widget: string }
              - { label: Social followers, name: socialFollowers, widget: string }
              - { label: Who your readers are, name: audience, widget: text }
              - { label: What you offer, name: offers, widget: list, field: { label: Offer, name: offer, widget: string } }
          - label: Visitor statistics
            name: analytics
            widget: object
            collapsed: true
            fields:
              - { label: Cloudflare Web Analytics token, name: cloudflareBeaconToken, widget: string, required: false, hint: 'Optional. Leave blank if you turned on analytics in the Cloudflare Pages dashboard instead.' }
